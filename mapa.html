<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <meta name="description" content="Mapa míst rodiny Jirman — kde se kdo narodil, ženil, žil a zemřel. Soukromá stránka, neindexovat.">
  <title>Mapa míst — Rodokmen rodiny Jirman</title>
  <link rel="stylesheet" href="./css/style.css?v=4">
  <link rel="stylesheet" href="./fonts/fonts.css?v=1">
  <link rel="stylesheet" href="./css/hlavicka.css?v=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
</head>
<body class="page-map">
  <header class="topbar">
    <div class="brand">
      <h1>Rodokmen rodiny Jirman</h1>
      <p id="meta-line">Načítání mapy míst…</p>
    </div>
    <div class="search">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20 21.5 21.5 20zM9.5 14C7 14 5 12 5 9.5S7 5 9.5 5 14 7 14 9.5 12 14 9.5 14z"/></svg>
      <input id="q" type="search" placeholder="Hledat obec nebo jméno…" autocomplete="off" enterkeyhint="search">
      <div id="results" class="search-results"></div>
    </div>
    <div class="tools">
      <button type="button" id="fit" title="Zobrazit všechna místa v Česku">Celek</button>
      <button type="button" id="filters-btn" aria-pressed="true" title="Filtry">Filtry</button>
    </div>
  </header>
  <div class="subnav-wrap">
    <nav class="sitenav" aria-label="Sekce webu">
      <a href="./index.html">Rodokmen</a>
      <a href="./mapa.html" class="is-active" aria-current="page">Mapa míst</a>
      <a href="./povolani.html">Povolání</a>
      <a href="./kniha.html">Kniha</a>
    </nav>
  </div>

  <aside class="map-filters" id="filters">
    <h2>Typ události</h2>
    <div id="type-filters" class="filter-list"></div>
    <h2>Období</h2>
    <div class="year-row">
      <label>Od <input type="number" id="year-from" inputmode="numeric"></label>
      <label>Do <input type="number" id="year-to" inputmode="numeric"></label>
    </div>
    <input type="range" id="year-from-r" min="1600" max="2026" class="year-range">
    <input type="range" id="year-to-r" min="1600" max="2026" class="year-range">
    <label class="chk"><input type="checkbox" id="undated" checked> Zahrnout i údaje bez roku</label>
    <h2>Větve</h2>
    <div id="branch-filters" class="branches"></div>
    <label class="chk"><input type="checkbox" id="unattached" checked> I osoby z nepřipojených větví</label>
    <p class="legend-note">U žijících osob je jen obec, ne adresa ani číslo domu. Body jsou středy obcí, ne konkrétní stavení. Nejistá místa jsou dole v seznamu, ne na mapě.</p>
    <div id="unplaced-box"></div>
  </aside>

  <div id="map" class="geo-map" role="application" aria-label="Zeměpisná mapa událostí"></div>

  <aside class="panel" id="panel" aria-hidden="true">
    <button type="button" class="close" id="panel-close" aria-label="Zavřít">×</button>
    <div id="panel-body"></div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="./js/spolecne.js?v=5"></script>
  <script src="./js/mapa-udalosti.js?v=7"></script>
</body>
</html>
